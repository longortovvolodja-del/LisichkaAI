name: Android APK release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lisichka-android-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Read release version and notes
        id: meta
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          awk -v version="$VERSION" '
            $0 ~ "^## " version "([[:space:]]|$)" { found=1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for version $VERSION" >&2
            exit 1
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Лисичка ИИ v${{ steps.meta.outputs.version }}
          body_path: release-notes.md
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          make_latest: true

      - name: Prepare next development version
        if: success()
        shell: bash
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$(cat VERSION)"
          NEXT_PATCH=$((PATCH + 1))
          printf '%s.%s.%s\n' "$MAJOR" "$MINOR" "$NEXT_PATCH" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: prepare next development version"
          git push
